# Cloudflare Pages config, checked in so a deploy does not depend on dashboard state.
name = "monaco-web"
pages_build_output_dir = "."
compatibility_date = "2025-09-23"
# lib/waitlist.js hashes IPs with node:crypto's createHash. Without this flag that
# import fails at startup and both endpoints return 500.
compatibility_flags = ["nodejs_compat"]
