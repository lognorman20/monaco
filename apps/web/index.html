<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monaco · Start a hedge fund with your friends</title>
<meta name="description" content="Pool money with your friends, vote on what to buy, and everyone owns a slice of the pot. Join the Monaco waitlist.">
<meta name="theme-color" content="#F8F5EE">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://trymonaco.xyz/">
<meta property="og:title" content="Monaco · Start a hedge fund with your friends">
<meta property="og:description" content="Pool money with your friends, vote on what to buy, and everyone owns a slice of the pot. Join the waitlist.">
<meta property="og:image" content="https://trymonaco.xyz/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://trymonaco.xyz/assets/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #F8F5EE;
    --bg-2: #FFFFFF;
    --ink: #0F291C;
    --ink-2: rgba(15, 41, 28, 0.68);
    --ink-3: rgba(15, 41, 28, 0.48);
    --line: rgba(15, 41, 28, 0.10);
    --line-strong: rgba(15, 41, 28, 0.18);
    --green: #1E8C55;
    --green-soft: #E4F2E6;
    --mint: #BFE6C8;
    --up: #1E8C55;
    --down: #C8543E;
    --radius: 14px;
    --sans: "Outfit", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img, svg, video { display: block; max-width: 100%; }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: 20px; }

  /* Nav */
  .nav { position: sticky; top: 0; z-index: 10; background: rgba(248, 245, 238, 0.82); backdrop-filter: saturate(140%) blur(12px); -webkit-backdrop-filter: saturate(140%) blur(12px); border-bottom: 1px solid transparent; transition: border-color .2s; padding-top: env(safe-area-inset-top, 0px); }
  .nav.scrolled { border-color: var(--line); }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand .m { width: 30px; height: 30px; }
  .brand .w { height: 21px; width: auto; }
  .btn { font: inherit; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 11px 20px; min-height: 44px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; touch-action: manipulation; transition: transform .15s ease, background .15s ease; }
  .btn:hover { background: #1A3D2B; border-color: #1A3D2B; }
  .btn:active { transform: scale(0.98); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { border-color: var(--ink-2); background: transparent; }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  .btn[disabled] { opacity: .6; cursor: progress; }

  /* Hero */
  .hero { position: relative; padding-block: 88px 56px; text-align: center; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: -20% -10% auto; height: 620px; background: radial-gradient(45% 55% at 30% 25%, rgba(191, 230, 200, 0.75), transparent 70%), radial-gradient(40% 50% at 72% 35%, rgba(255, 221, 160, 0.45), transparent 70%); pointer-events: none; }
  .hero .wrap { position: relative; display: grid; justify-items: center; gap: 26px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 8px; }
  .pill .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--green-soft); display: grid; place-items: center; }
  .pill .dot img { width: 12px; height: 12px; }
  h1 { margin: 0; font-weight: 600; font-size: clamp(46px, 8.4vw, 92px); line-height: 0.98; letter-spacing: -0.035em; text-wrap: balance; }
  h1 em, h2 em { font-style: normal; color: var(--green); }
  .sub { margin: 0; max-width: 34em; font-size: clamp(17px, 2.1vw, 20px); color: var(--ink-2); text-wrap: balance; }

  /* Waitlist form */
  .join { width: 100%; max-width: 480px; display: grid; gap: 10px; }
  .field { display: flex; padding: 4px; border-radius: 999px; background: #fff; border: 1px solid var(--line-strong); box-shadow: 0 10px 30px -18px rgba(15, 41, 28, 0.35); transition: border-color .15s; }
  .field:focus-within { border-color: var(--green); }
  .field.invalid, .field.invalid:focus-within { border-color: var(--down); }
  .field input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 0; padding: 12px 14px; outline: none; }
  .field input::placeholder { color: var(--ink-3); }
  .join .btn.submit { width: 100%; padding-block: 13px; font-size: 16px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .status { min-height: 22px; margin: 0; font-size: 14px; color: var(--ink-3); }
  .status.ok { color: var(--up); }
  .status.err { color: var(--down); }
  .join.done .field, .join.done .btn.submit { display: none; }
  .joined { display: none; align-items: center; justify-content: center; gap: 10px; padding: 14px 18px; border-radius: 999px; background: var(--green-soft); border: 1px solid var(--mint); color: var(--ink); font-weight: 500; }
  .join.done .joined { display: flex; }

  /* Video. Placeholder frame until VIDEO_URL is set in the script below. */
  .video { padding-block: 8px 96px; }
  .video figure { margin: 0; display: grid; gap: 12px; }
  .frame { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 20px; overflow: hidden; background: #0F291C; border: 1px solid var(--line); box-shadow: 0 40px 90px -40px rgba(15, 41, 28, 0.45); }
  .frame > video, .frame > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; background: radial-gradient(60% 70% at 50% 45%, #1C4330, #0F291C 70%); }
  .placeholder img { width: clamp(72px, 12vw, 120px); opacity: .95; }
  .placeholder p { margin: 0; color: rgba(242, 235, 225, 0.6); font-size: 15px; }
  .play { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; cursor: pointer; display: grid; place-items: center; background: #0F291C center / cover no-repeat; }
  .play::before { content: ""; position: absolute; inset: 0; background: rgba(15, 41, 28, 0.32); }
  .play .disc { position: relative; width: 76px; height: 76px; border-radius: 50%; background: rgba(248, 245, 238, 0.95); color: var(--ink); display: grid; place-items: center; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6); transition: transform .15s ease; }
  .play .disc svg { margin-left: 3px; }
  .play:hover .disc { transform: scale(1.06); }
  .play:focus-visible { outline: 2px solid var(--green); outline-offset: -4px; }
  .video figcaption { margin: 0; color: var(--ink-3); font-size: 14px; text-align: center; }

  /* Sections */
  section { scroll-margin-top: 80px; }
  .sec { padding-block: 96px; border-top: 1px solid var(--line); }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--green); margin: 0 0 14px; }
  h2 { margin: 0; font-weight: 600; font-size: clamp(34px, 5vw, 56px); line-height: 1.02; letter-spacing: -0.03em; text-wrap: balance; max-width: 16em; }
  .lede { margin: 18px 0 0; max-width: 36em; color: var(--ink-2); font-size: 18px; }


  /* CTA + footer */
  footer { border-top: 1px solid var(--line); padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); color: var(--ink-3); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: center; align-items: center; }
  footer p { margin: 0; }
  .social { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding-inline: 4px; color: var(--ink-2); text-decoration: none; font-weight: 500; transition: color .15s; }
  .social:hover { color: var(--ink); }
  .social:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 6px; }

  @media (max-width: 860px) {
    .sec { padding-block: 72px; }
  }
  @media (max-width: 480px) {
    .wrap { padding-inline: 16px; }
    .nav .btn { padding: 10px 16px; font-size: 14px; }
    .brand .w { height: 18px; }
    .hero { padding-block: 40px 32px; }
    .field input { padding: 13px 14px; }
    .join .btn.submit { padding-block: 14px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; }
    .rise:nth-child(2) { animation-delay: .06s; } .rise:nth-child(3) { animation-delay: .12s; } .rise:nth-child(4) { animation-delay: .18s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Monaco home">
      <img class="m" src="/assets/mark-ink.svg" alt="" width="30" height="30">
      <img class="w" src="/assets/wordmark-ink.svg" alt="monaco" width="133" height="21">
    </a>
    <a class="btn" href="#join">Join the waitlist</a>
  </div>
</header>

<main>
  <section class="hero" id="join">
    <div class="wrap">
      <span class="pill rise"><span class="dot"><img src="/assets/mark-ink.svg" alt=""></span>Coming to iOS</span>
      <h1 class="rise">Start a hedge fund with your <em>friends.</em></h1>
      <p class="sub rise">Pool money with your friends, vote on what to buy, and everyone owns a slice of the pot.</p>
      <form class="join rise" data-waitlist novalidate>
        <div class="field">
          <label for="twitter-hero" class="hp">Twitter handle (optional)</label>
          <input id="twitter-hero" name="twitter" type="text" autocomplete="off" placeholder="Twitter handle (optional)" maxlength="16">
        </div>
        <div class="field">
          <label for="email-hero" class="hp">Email</label>
          <input id="email-hero" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" required>
        </div>
        <button class="btn submit" type="submit">Join the waitlist</button>
        <div class="hp" aria-hidden="true"><label for="company-hero">Company</label><input id="company-hero" name="company" tabindex="-1" autocomplete="off"></div>
        <div class="joined" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>You're on the list. We'll email you when your invite is ready.</div>
        <p class="status" aria-live="polite">iOS first.</p>
      </form>
    </div>
  </section>

  <section class="video" aria-label="Product video">
    <div class="wrap">
      <figure>
        <div class="frame" id="frame">
          <div class="placeholder">
            <img src="/assets/mark.svg" alt="">
            <p>Demo video coming soon.</p>
          </div>
        </div>
        <figcaption id="video-caption" hidden>How a Monaco fund works, from first deposit to first vote.</figcaption>
      </figure>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <a class="brand" href="/" aria-label="Monaco home"><img class="m" src="/assets/mark-ink.svg" alt="" width="24" height="24" style="width:24px;height:24px"><img class="w" src="/assets/wordmark-ink.svg" alt="monaco" style="height:16px;width:auto"></a>
    <a class="social" href="https://x.com/trymonaco" target="_blank" rel="noopener" aria-label="Monaco on Twitter (@trymonaco)"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>@trymonaco</a>
  </div>
</footer>

<script>
(function () {
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var TWITTER = /^[A-Za-z0-9_]{1,15}$/;
  var BAD_TWITTER = "Enter a valid Twitter handle, like @monaco, or leave it blank.";
  var ENDPOINT = "/api/waitlist";

  // ───────────────────────────── Demo video ─────────────────────────────
  // THE ONE EDIT: put the video URL here and the player replaces the
  // "coming soon" placeholder. Leave it "" and the placeholder stays.
  //
  //   Cloudflare R2 file  "https://media.trymonaco.xyz/demo.mp4"
  //                       Preferred. R2 has no egress fees, so plays are free.
  //   Unlisted embed      "https://www.youtube.com/embed/VIDEO_ID"
  //                       or "https://player.vimeo.com/video/VIDEO_ID"
  //
  // Never commit the video itself, and never serve it from Pages. A file URL
  // gets preload="none", so the bytes are fetched only when someone presses
  // play; an embed URL sits behind a poster and a real button, so the third
  // party is not contacted on page load either.
  var VIDEO_URL = "";
  var VIDEO_POSTER = "/assets/video-poster.png";
  // ──────────────────────────────────────────────────────────────────────

  function twitterHandle(value) {
    var handle = value.trim().replace(/^@/, "");
    if (handle === "") return "";
    return TWITTER.test(handle) ? handle : null;
  }

  var nav = document.getElementById("nav");
  function onScroll() { nav.classList.toggle("scrolled", window.scrollY > 8); }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  function params() {
    var q = new URLSearchParams(location.search);
    return { ref: q.get("ref") || q.get("utm_source") || "" };
  }

  document.querySelectorAll("form[data-waitlist]").forEach(function (form) {
    var input = form.querySelector('input[name="email"]');
    var twitterInput = form.querySelector('input[name="twitter"]');
    var trap = form.querySelector('input[name="company"]');
    var button = form.querySelector('button[type="submit"]');
    var status = form.querySelector(".status");
    function say(text, kind) { status.textContent = text; status.className = "status" + (kind ? " " + kind : ""); }
    function mark(el, bad) { el.setAttribute("aria-invalid", bad ? "true" : "false"); el.parentNode.classList.toggle("invalid", bad); }
    function checkTwitter() {
      var bad = twitterHandle(twitterInput.value) === null;
      mark(twitterInput, bad);
      if (bad) say(BAD_TWITTER, "err");
      return !bad;
    }

    twitterInput.addEventListener("blur", checkTwitter);
    twitterInput.addEventListener("input", function () {
      if (twitterInput.getAttribute("aria-invalid") === "true" && twitterHandle(twitterInput.value) !== null) { mark(twitterInput, false); say(""); }
    });
    input.addEventListener("input", function () { if (input.getAttribute("aria-invalid") === "true") { mark(input, false); say(""); } });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!checkTwitter()) { twitterInput.focus(); return; }
      var email = input.value.trim();
      if (!EMAIL.test(email)) { mark(input, true); say("Enter a valid email, like you@email.com.", "err"); input.focus(); return; }
      button.disabled = true; say("Adding you…");
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 10000);
      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, twitter: twitterHandle(twitterInput.value), company: trap.value, source: params().ref }),
        signal: ctrl.signal
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (body) { return { ok: res.ok, status: res.status, body: body }; });
      }).then(function (r) {
        if (r.ok) {
          document.querySelectorAll("form[data-waitlist]").forEach(function (f) { f.classList.add("done"); f.querySelector(".status").textContent = ""; });
          return;
        }
        if (r.status === 429) say("Too many tries from this network. Try again in an hour.", "err");
        else if (r.status === 400) say(r.body.error || "That email didn't look right. Check it and try again.", "err");
        else say("The waitlist is having trouble right now. Try again in a minute.", "err");
      }).catch(function () {
        say("Couldn't reach the waitlist. Check your connection and try again.", "err");
      }).finally(function () { clearTimeout(timer); button.disabled = false; });
    });
  });

  (function () {
    var frame = document.getElementById("frame");
    if (!frame || !VIDEO_URL) return;
    var el;
    if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(VIDEO_URL)) {
      el = document.createElement("video");
      el.src = VIDEO_URL;
      el.poster = VIDEO_POSTER;
      el.controls = true;
      el.preload = "none";  // nothing downloads until the visitor presses play
      el.playsInline = true;
      el.setAttribute("aria-describedby", "video-caption");
      // Captions: drop a WebVTT file at /assets/demo.vtt and uncomment.
      // var cc = document.createElement("track");
      // cc.kind = "captions"; cc.src = "/assets/demo.vtt";
      // cc.srclang = "en"; cc.label = "English"; cc.default = true;
      // el.appendChild(cc);
    } else {
      // Poster plus a real button. The iframe is built on click, so an unlisted
      // YouTube or Vimeo embed costs nothing and sees nobody who doesn't watch.
      el = document.createElement("button");
      el.type = "button";
      el.className = "play";
      el.style.backgroundImage = "url(" + VIDEO_POSTER + ")";
      el.setAttribute("aria-label", "Play the Monaco demo video");
      el.innerHTML = '<span class="disc" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>';
      el.addEventListener("click", function () {
        var iframe = document.createElement("iframe");
        // autoplay is fine here: it follows the visitor's own click.
        iframe.src = VIDEO_URL + (VIDEO_URL.indexOf("?") < 0 ? "?" : "&") + "autoplay=1";
        iframe.title = "Monaco demo video";
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.setAttribute("allowfullscreen", "");
        frame.replaceChildren(iframe);
      });
    }
    frame.replaceChildren(el);
    var caption = document.getElementById("video-caption");
    if (caption) caption.hidden = false;
  })();
})();
</script>
</body>
</html>
